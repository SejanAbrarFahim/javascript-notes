<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DOM Radio Button</title>
</head>
<body>
    <h1>Select your favorite programming language</h1>

    <div>
        <input type="radio" name="language" id="ts" value="TypeScript">
        <label for="ts">TypeScript</label>
    </div>
    <div>
        <input type="radio" name="language" value="JavaScript" id="js">
        <label for="js">JavaScript</label>
    </div>
    <div>
        <input type="radio" name="language" value="python"
         id="py">
         <label for="py">python</label>
    </div>
   
    <div>
        <button id="btn">Show Data</button>
        <p id="output"></p>
    </div>

    <script src="script.js"></script>
</body>
</html>
