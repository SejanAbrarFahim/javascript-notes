<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>History Objects</title>
</head>
<body>
    
    <button onclick="history.back()">Back button</button>
    <button onclick="history.forward()"> forward button</button>
    <button onclick="history.go(-1)">go back one page button</button>
    <button onclick="history.go(0)">Refresh</button>
</body>
</html>
